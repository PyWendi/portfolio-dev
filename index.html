<!DOCTYPE html>
<html lang="">

<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/src/assets/img/logo/thumbnail.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anderson's Portfolio</title>

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Krona+One&family=Momo+Signature&display=swap" rel="stylesheet">

  <style>
    html {
      scroll-behavior: smooth;
      margin: 0;
      padding: 0;
      width: 100vw !important;
      scrollbar-width: thin;
      scrollbar-color: #0f6e46 #0a181d;
    }

    /* Scrollbar Customization for Chrome, Safari, and Opera */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #0a181d;
    }

    ::-webkit-scrollbar-thumb {
      background: #0f6e46;
      border-radius: 9999px;
      border: 1px solid #0a181d;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #4ade80;
    }
  </style>

</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
